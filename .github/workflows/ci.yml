name: CI

on:
  push:
    branches: [ dev, main, v*.x ]
    tags:
      - v**
  pull_request:

jobs:
  validate-api-docs:
    name: API Docs Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Add Problem Matcher
        run: echo "::add-matcher::.github/problem-matchers/validate-api-docs.json"
      - run: bash ./scripts/ci/validate-api-docs/validate-api-docs.sh

  validate-gradle-wrapper:
    name: Gradle Wrapper Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  validate-migration:
    name: fbs-core.api / DB Migration Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Check Migration files
        run: bash ./scripts/ci/validate-migrations.sh modules/fbs-core/api/src/main/resources/migrations

  fbs-identity-service:
    name: fbs-identity-service
    runs-on: ubuntu-latest
    needs: [ "validate-gradle-wrapper" ]

    steps:
      - name: Start MySQL service container
        run: >
          docker run -d --rm --name identity-mysql
          -e MYSQL_ROOT_PASSWORD=twRuvi2ejllDdA4nnQLa08O
          -e MYSQL_DATABASE=fbs_identity
          -p 127.0.0.1:3306:3306
          mysql:8.0.30
          --default-authentication-plugin=mysql_native_password
          --sql_mode=""

      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Wait for MySQL
        run: |
          until docker exec identity-mysql mysqladmin ping -h localhost -uroot -ptwRuvi2ejllDdA4nnQLa08O --silent; do
            sleep 2
          done

      - name: Run Identity-Service tests
        working-directory: modules/fbs-identity-service/api
        env:
          OIDC_SIGNING_KEY_LOCATION: src/test/resources/identity-signing-test.p12
          OIDC_SIGNING_KEY_STORE_PASSWORD: changeit
          OIDC_SIGNING_KEY_ALIAS: identity-signing-test
          OIDC_SIGNING_KEY_PASSWORD: changeit
        run: ./gradlew clean test

      - name: Stop MySQL service container
        if: always()
        run: docker stop identity-mysql || true

  fbs-web-shell:
    name: fbs-web-shell (Vue 3 / Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'modules/fbs-web-shell/package-lock.json'

      - name: Install dependencies
        working-directory: modules/fbs-web-shell
        run: npm ci

      - name: Type Check
        working-directory: modules/fbs-web-shell
        run: npm run type-check

      - name: Run Vitest Suite
        working-directory: modules/fbs-web-shell
        run: npm test

      - name: Build Web Shell
        working-directory: modules/fbs-web-shell
        run: npm run build-only

  sql-playground:
    name: sql-playground (Angular)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'modules/sql-playground/web/package-lock.json'

      - name: Install dependencies
        working-directory: modules/sql-playground/web
        run: npm ci --legacy-peer-deps

      - name: Build SQL Playground
        working-directory: modules/sql-playground/web
        run: npm run build

  fbs-core-api:
    name: fbs-core.api
    uses: ./.github/workflows/check-fbs-module.yml
    needs: [ "validate-gradle-wrapper", "validate-migration" ]
    with:
      name: fbs-core.api
      lintArguments: :fbs-core.api:scalastyleCheck :fbs-core.api:ktlintCheck :fbs-core.math-parser:ktlintCheck
      testArguments: :fbs-core.api:test :fbs-core.math-parser:test
      coverageArguments: :fbs-core.api:jacocoReport :fbs-core.math-parser:jacocoReport
      coverageFilesLocation: modules/fbs-core/api/build/reports/jacoco/jacocoReport/jacocoReport.xml,modules/fbs-core/math-parser/build/reports/jacoco/jacocoReport/jacocoReport.xml
      startMysqlService: true
      startMinioService: true
      problemMatcher: java.json,kotlin.json

  fbs-core-web:
    name: fbs-core.web
    uses: ./.github/workflows/check-fbs-module.yml
    needs: [ "validate-gradle-wrapper" ]
    with:
      name: fbs-core.web
      lintArguments: :fbs-core.web:lint
      testArguments: :fbs-core.web:build
      setupNode: true

  fbs-runner-checker:
    name: fbs-runner.checker
    uses: ./.github/workflows/check-fbs-module.yml
    needs: [ "validate-gradle-wrapper" ]
    with:
      name: fbs-runner.checker
      lintArguments: :fbs-runner.checker:scalastyleCheck
      testArguments: :fbs-runner.checker:test
      coverageArguments: :fbs-runner.checker:jacocoReport
      coverageFilesLocation: modules/fbs-runner/checker/build/reports/jacoco/jacocoReport/jacocoReport.xml
      problemMatcher: java.json

  fbs-sql-checker:
    name: fbs-sql-checker
    uses: ./.github/workflows/check-fbs-python-module.yml
    with:
      working-directory: ./modules/fbs-sql-checker

  fbs-eat:
    name: fbs-eat
    uses: ./.github/workflows/check-fbs-python-module.yml
    with:
      working-directory: ./modules/fbs-eat/eat

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [ "validate-gradle-wrapper", "validate-migration" ]

    steps:
      - uses: actions/checkout@v7
      - name: Build Docker images
        run: docker compose build

  e2e-playwright:
    name: Playwright E2E Test Suite
    runs-on: ubuntu-latest
    needs: [ "fbs-web-shell", "fbs-identity-service", "sql-playground" ]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build mysql1 identity-service core course-management-web sql-playground-web web-shell
          echo "Waiting for services to become healthy..."
          timeout 120 bash -c 'until docker compose ps | grep -v "Exit"; do sleep 3; done' || true

      - name: Run Playwright E2E Tests
        env:
          E2E_BASE_URL: http://localhost:8083
          IDP_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v || true
