# Example Nginx snippet when authentication already happens in a trusted upstream
# component and Nginx only forwards the sanitized identity header to Feedbacksystem.

server {
    listen 443 ssl http2;
    server_name feedback.example.org;

    ssl_certificate     /etc/ssl/certs/feedback.example.org.crt;
    ssl_certificate_key /etc/ssl/private/feedback.example.org.key;

    # Reject direct client-supplied identity headers.
    proxy_set_header X-Forwarded-User "";
    proxy_set_header Remote-User "";
    proxy_set_header SM_USER "";

    location / {
        proxy_pass https://core:443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The variable name here is only an example. Replace it with the identity
    # value provided by your auth gateway or ingress.
    location = /api/v1/login/sso {
        proxy_pass https://core:443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-User $auth_user;
    }

    # Optional migration alias for older integrations.
    location = /api/v1/login/cas {
        proxy_pass https://core:443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-User $auth_user;
    }
}
