# Example Apache vhost for Feedbacksystem behind Shibboleth SP.
# Adjust certificates, hostnames, and backend target to your environment.

<VirtualHost *:443>
    ServerName feedback.example.org

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/feedback.example.org.crt
    SSLCertificateKeyFile /etc/ssl/private/feedback.example.org.key

    ProxyPreserveHost On
    SSLProxyEngine On

    # Never forward client-supplied identity headers unchanged.
    RequestHeader unset X-Forwarded-User early
    RequestHeader unset Remote-User early
    RequestHeader unset SM_USER early
    RequestHeader unset eppn early

    # Main application upstream.
    ProxyPass / https://core:443/
    ProxyPassReverse / https://core:443/

    # Generic SSO endpoint.
    <Location /api/v1/login/sso>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require valid-user

        RequestHeader set X-Forwarded-User %{eppn}e env=eppn
    </Location>

    # Optional migration alias for older LMS or IdP callback configurations.
    <Location /api/v1/login/cas>
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        Require valid-user

        RequestHeader set X-Forwarded-User %{eppn}e env=eppn
    </Location>
</VirtualHost>
