<div>
  <p class="title">Indexes</p>
  @for (entry of indexes; track entry) {
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>{{ entry.collection }}</mat-panel-title>
    </mat-expansion-panel-header>
    <ul class="attribute-list">
      @for (idx of entry.indexes; track idx) {
      <li>
        <span class="attribute"> Name: {{ idx.name }} </span>
        <span class="attribute"> Felder: {{ idx.key | json }} </span>
      </li>
      }
    </ul>
  </mat-expansion-panel>
  }
</div>
