<mat-card-actions>
  @if (tabs?.length === 0) {
  <mat-card appearance="outlined" class="info-card">
    <mat-card-header>
      <mat-card-title>
        {{ "sql-playground.result-table.create-first-query" | i18nextEager }}
      </mat-card-title>
    </mat-card-header>
  </mat-card>
  } @if (tabs?.length > 0) {
  <mat-tab-group
    [(selectedIndex)]="activeTabIndex"
    (selectedIndexChange)="updateActiveTab($event)"
  >
    @for (tab of tabs; track tab; let index = $index) {
    <mat-tab>
      <ng-template [mat-tab-label]>
        {{ tab.name }}
        @if (index !== 0) {
        <button mat-icon-button (click)="closeTab(index)">
          <mat-icon>remove_circle_outline</mat-icon>
        </button>
        }
        <button mat-icon-button (click)="addTab()">
          <mat-icon>add_circle_outline</mat-icon>
        </button>
      </ng-template>
      <app-dynamic-result-table-tab
        [index]="index"
      ></app-dynamic-result-table-tab>
    </mat-tab>
    }
  </mat-tab-group>
  }
</mat-card-actions>
