<div class="container">
  <app-menu-bar>
    <button
      mat-icon-button
      routerLink="/courses"
      matTooltip="{{ 'course.tooltip.backToOverview' | i18nextEager }}"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="spacer"></span>
    @if (isAdmin()) {
    <button
      mat-button
      routerLink="/admin/task-providers"
      color="primary"
      matTooltip="{{ 'task-provider.management.title' | i18nextEager }}"
    >
      <mat-icon>settings_input_component</mat-icon>&nbsp;{{
        "task-provider.management.button" | i18nextEager
      }}
    </button>
    }
  </app-menu-bar>

  <mat-form-field class="search" appearance="outline">
    <mat-label>{{ "course.search.label.search" | i18nextEager }}</mat-label>
    <input
      type="text"
      attr.aria-label="{{ 'course.search.label.search' | i18nextEager }}"
      matInput
      [formControl]="control"
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="create-course">
    @if (isAuthorized()) {
    <button
      mat-raised-button
      color="accent"
      (click)="createCourse()"
      matTooltip="{{ 'course.search.tooltip.createCourse' | i18nextEager }}"
    >
      <mat-icon>add</mat-icon>&nbsp;{{
        "course.search.label.createCourse" | i18nextEager
      }}
    </button>
    }
  </div>

  @for (course of filteredCourses | async; track course) {
  <app-course-preview [data]="course"></app-course-preview>
  } @if ((courses | async)?.length === 0) {
  <span class="noElements">{{
    "course.search.error.noCourses" | i18nextEager
  }}</span>
  }
</div>
