<div class="container">
  @if (role || isAuthorized()) {
  <app-menu-bar>
    <button
      mat-icon-button
      [routerLink]="['/', 'courses', courseID]"
      matTooltip="{{ 'sql-checker.tooltip.back-to-course' | i18nextEager }}"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="spacer"></span>
  </app-menu-bar>
  }

  <div class="task-list">
    @for (task of tasks; track task) {
    <div>
      <mat-card
        appearance="outlined"
        class="task-container"
        id="{{ task.id }}"
        [routerLink]="[
          '/',
          'courses',
          courseID,
          'sql-checker-results',
          task.id
        ]"
      >
        <span>{{ task.name }}</span>
      </mat-card>
    </div>
    }
  </div>
</div>
