<mat-dialog-content>
  <div class="content">
    <markdown id="markOutput" [data]="markdown"></markdown>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  @if (!onlyForShow) {
  <mat-checkbox [(ngModel)]="privacyChecked"
    >{{ "dialog.privacy.label.agreeWithPrivacyPolicy" | i18nextEager }}
  </mat-checkbox>
  }
  <div class="action-buttons">
    @if (!onlyForShow) {
    <button mat-flat-button color="warn" (click)="abort()">
      {{ "dialog.privacy.label.cancel" | i18nextEager }}
    </button>
    } @if (!onlyForShow) {
    <button mat-flat-button color="accent" (click)="login()">
      {{ "dialog.privacy.label.login" | i18nextEager }}
    </button>
    } @if (onlyForShow) {
    <button mat-flat-button color="accent" (click)="abort()">
      {{ "dialog.privacy.label.close" | i18nextEager }}
    </button>
    }
  </div>
</mat-dialog-actions>
