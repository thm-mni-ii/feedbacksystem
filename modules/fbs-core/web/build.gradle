plugins {
  id "com.github.node-gradle.node" version "3.5.1"
}

apply plugin: 'distribution'
apply plugin: 'idea'

repositories {
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

node {
    version = '18.20.4'
    download = true
    npmInstallCommand = 'ci'
}

npmInstall {
    args = ['--legacy-peer-deps']
}

clean.dependsOn npm_run_clean
assemble.dependsOn npm_run_dist
installDist.dependsOn npm_run_dist

defaultTasks "build"

distributions {
    main {
        contents {
            from("${projectDir}/dist/web") {
                include '*/**'
            }
        }
    }
}

// After build the ng app, we copy the dist content to our spring boot webservice static resource path
task copyWebToWS(type: Copy, dependsOn: [build]) {
    from "${projectDir}/dist/web" // path from distributed web-gui
    into "${projectDir}/../api/src/main/resources/static"
}

copyWebToWS

// Run eslint
task lint(type: NpmTask, dependsOn: [npmInstall]) {
  args = ['run', 'lint']
}

check.dependsOn lint
