sso:
  client-host-url: ${SERVER_HOST:https://localhost}
  login-url: ${SSO_LOGIN_URL:}
  return-url-parameter: ${SSO_RETURN_URL_PARAMETER:}
  principal-header-names: ${SSO_PRINCIPAL_HEADER_NAMES:X-Forwarded-User,Remote-User,SM_USER,eppn}
  success-url: ${SSO_SUCCESS_URL:/login}
  failure-url: ${SSO_FAILURE_URL:/login?ssoError=1}
saml:
  # Set to true to activate SAML SP mode (the app handles the full SAML handshake itself).
  # When false, the legacy header-injection / SSO_LOGIN_URL flow is used instead.
  enabled: ${SAML_ENABLED:false}
  sp:
    # Entity ID advertised in SP metadata. The IdP uses this to identify the SP.
    entity-id: ${SAML_SP_ENTITY_ID:${SERVER_HOST:https://localhost}/api/v1/login/saml/metadata}
    # Assertion Consumer Service URL — where the IdP POSTs the SAMLResponse after login.
    acs-url: ${SAML_SP_ACS_URL:${SERVER_HOST:https://localhost}/api/v1/login/saml/acs}
    # Single Logout Service URL.
    slo-url: ${SAML_SP_SLO_URL:${SERVER_HOST:https://localhost}/api/v1/logout}
    # SAML attribute name whose value is used as the application username.
    # For the kristophjunge/test-saml-idp image this is 'uid'.
    principal-attribute: ${SAML_SP_PRINCIPAL_ATTRIBUTE:uid}
    # Base64-DER-encoded PKCS8 RSA private key (no PEM headers).
    # Leave empty to use an ephemeral self-signed key (development only).
    private-key: ${SAML_SP_PRIVATE_KEY:}
    # Base64-DER-encoded X.509 certificate matching the private key (no PEM headers).
    # Leave empty to use an ephemeral self-signed certificate (development only).
    certificate: ${SAML_SP_CERTIFICATE:}
  idp:
    # IdP SSO endpoint (HTTP-Redirect binding).
    sso-url: ${SAML_IDP_SSO_URL:http://localhost:8080/simplesaml/saml2/idp/SSOService.php}
    # Base64-DER-encoded IdP signing certificate (no PEM headers).
    # Leave empty to skip signature validation (development only — insecure).
    certificate: ${SAML_IDP_CERTIFICATE:}
compile:
  production: true
jwt:
  secret: ${JWT_SECRET:8Dsupersecurekeydf0}
  expiration:
    time: 43200
ldap:
  enabled: ${LDAP_ENABLED:false}
  allowLogin: ${LDAP_ALLOW_LOGIN:false}
  baseDn: ${LDAP_BASE_DN:dc=fh-giessen-friedberg,dc=de}
  url: ${LDAP_URL:ldaps://ldap.fh-giessen.de}
  startTls: ${LDAP_START_TLS:false}
  filter: ${LDAP_FILTER:(uid={user})}
  timeout: ${LDAP_TIMEOUT:5000}
  bind:
    enabled: ${LDAP_BIND_ENABLED:false}
    dn: ${LDAP_BIND_DN:}
    password: ${LDAP_BIND_PASSWORD:}
  attributeNames:
    uid: ${LDAP_ATTRIBUTE_NAMES_UID:uid}
    sn: ${LDAP_ATTRIBUTE_NAMES_SN:sn}
    name: ${LDAP_ATTRIBUTE_NAMES_NAME:givenName}
    mail: ${LDAP_ATTRIBUTE_NAMES_MAIL:mail}
logging:
  level:
    root: INFO
message:
  topic:
    name: java
security:
  basic:
    enabled: false
  antiBruteForce:
    trustedProxyCount: ${TRUSTED_PROXIES:0}
    interval: ${BRUTEFORCE_INTERVAL:600}
    maxAttempts: ${BRUTEFORCE_ATTEMPTS:10}
    protectedPaths: "/api/v1/login/ldap,/api/v1/login/local,/api/v1/login/unified"
    allowList: ${BRUTEFORCE_ALLOW_LIST:""}
