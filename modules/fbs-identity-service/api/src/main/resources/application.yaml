spring:
  application:
    name: fbs-identity-service
  graphql:
    graphiql:
      enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URI:jdbc:mysql://localhost:3306}/fbs_identity?autoReconnect=true&failOverReadOnly=false&maxReconnects=9&useSSL=false&allowMultiQueries=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:twRuvi2ejllDdA4nnQLa08O}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:true}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://localhost}
  saml:
    enabled: ${APP_SAML_ENABLED:false}
    registration-id: keycloak
    principal-attribute: uid
    prename-attribute: givenName
    surname-attribute: sn
    email-attribute: mail
    failure-path: /login?ssoError=1

info:
  app:
    version: 0.0.1-SNAPSHOT

springdoc:
  api-docs:
    path: /openapi

security:
  login-attempts:
    max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:150}
    max-failures-per-username: ${LOGIN_MAX_FAILURES_PER_USERNAME:10}
    window-seconds: ${LOGIN_FAILURE_WINDOW_SECONDS:600}
    cleanup-interval-ms: ${LOGIN_ATTEMPT_CLEANUP_INTERVAL_MS:600000}
    trusted-proxy-count: ${TRUSTED_PROXIES:0}
    allow-list: ${BRUTEFORCE_ALLOW_LIST:""}
