spring:
  application:
    name: fbs-identity-service
  graphql:
    graphiql:
      enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URI:jdbc:mysql://localhost:3306}/fbs?autoReconnect=true&failOverReadOnly=false&maxReconnects=9&useSSL=false&allowMultiQueries=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:twRuvi2ejllDdA4nnQLa08O}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: none
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:q/wBOsfT0wROMO8Uw7rTf+VVvgGczWhkoJSDcaqqPpk=}
    expires-in: ${JWT_EXPIRES_IN:3600}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://localhost}
  saml:
    enabled: false
    registration-id: keycloak
    principal-attribute: uid
    prename-attribute: givenName
    surname-attribute: sn
    email-attribute: mail
    success-path: /login
    failure-path: /login?ssoError=1
    jwt-cookie-name: jwt
    jwt-cookie-max-age-seconds: 30

info:
  app:
    version: 0.0.1-SNAPSHOT
