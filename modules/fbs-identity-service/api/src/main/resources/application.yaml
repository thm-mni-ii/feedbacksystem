spring:
  application:
    name: fbs-identity-service
  graphql:
    graphiql:
      enabled: false

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URI:jdbc:mysql://localhost:3306}/fbs?autoReconnect=true&failOverReadOnly=false&maxReconnects=9&useSSL=false&allowMultiQueries=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:twRuvi2ejllDdA4nnQLa08O}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: none
    show-sql: true

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://localhost}
  saml:
    enabled: false
    registration-id: keycloak
    principal-attribute: uid
    prename-attribute: givenName
    surname-attribute: sn
    email-attribute: mail
    failure-path: /login?ssoError=1

info:
  app:
    version: 0.0.1-SNAPSHOT

springdoc:
  api-docs:
    path: /openapi

security:
  login-attempts:
    max-failures-per-ip: 150
    max-failures-per-username: 10
    window-seconds: 600
    cleanup-interval-ms: 60000
    trusted-proxy-count: ${TRUSTED_PROXIES:0}
    allow-list: ${BRUTEFORCE_ALLOW_LIST:""}
