server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Frame embedding security headers - allow embedding across any HTTP/HTTPS origin (self, custom domain, minikube, prod)
    add_header Content-Security-Policy "frame-ancestors 'self' http: https:;" always;
    add_header X-Frame-Options "ALLOWALL" always;

    # Normalize trailing slash for base href resolution
    location = /sql-playground {
        return 301 $scheme://$http_host/sql-playground/;
    }

    # Proxy /api to the FBS Core backend
    location /api {
        proxy_pass        ${FBS_CORE_URL};
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_ssl_verify  off;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache-busted hashed assets (JS/CSS with content hash in filename)
    location ~* ^(?:/sql-playground)?/(.+\.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "frame-ancestors 'self' http: https:;" always;
        add_header X-Frame-Options "ALLOWALL" always;
    }

    # Angular SPA — fall back to index.html for any unmatched path
    location / {
        rewrite ^/sql-playground/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy "frame-ancestors 'self' http: https:;" always;
        add_header X-Frame-Options "ALLOWALL" always;
    }
}
